<header class="top-bar">
  <div class="app-shell">
    <div class="top-right">
      <span *ngIf="user" class="welcome">Welcome {{ userDisplayName }}!</span>
      <button *ngIf="user" class="link-btn" (click)="raffleService.signOut()">Log out</button>
      <a *ngIf="!user" class="link-btn" routerLink="/signin">Sign in</a>
    </div>
  </div>
  
</header>

<main class="app-shell">
  <router-outlet></router-outlet>
</main>
