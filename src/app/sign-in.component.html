<main class="auth-shell">
  <section class="auth-card">
    <section class="consent-gate" *ngIf="!consentAccepted" aria-labelledby="consent-title">
      <h1 id="consent-title">Before continuing</h1>
      <p class="consent-intro">Please review and accept both documents to continue.</p>
      <label class="consent-option" for="privacy-accepted">
        <input id="privacy-accepted" name="privacyAccepted" type="checkbox" [(ngModel)]="privacyAccepted">
        <span>I have reviewed and accept the <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>.</span>
      </label>
      <label class="consent-option" for="terms-accepted">
        <input id="terms-accepted" name="termsAccepted" type="checkbox" [(ngModel)]="termsAccepted">
        <span>I have reviewed and accept the <a href="/terms" target="_blank" rel="noopener">Terms &amp; Conditions</a>.</span>
      </label>
      <button class="primary-btn consent-continue" type="button" [disabled]="!privacyAccepted || !termsAccepted" (click)="acceptPolicies()">Accept and continue</button>
      <p class="consent-draft-note">These policy pages are drafts and need review before publication.</p>
    </section>

    <ng-container *ngIf="consentAccepted">
      <h1 *ngIf="step==='email'">Sign in with email</h1>
      <h1 *ngIf="step==='signin'">Enter your password</h1>
      <h1 *ngIf="step==='signup'">Create an account</h1>

      <div class="form-content" *ngIf="step==='email'">
        <div class="field-group">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com" [(ngModel)]="email" />
        </div>
        <div class="field-group">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" [(ngModel)]="password" />
        </div>
        <div class="actions">
          <button class="primary-btn" (click)="signIn()" [disabled]="loading">Sign in with email</button>
          <button class="google-btn" (click)="signInWithGoogle()" [disabled]="loading">Sign in with Google</button>
          <button class="text-btn" (click)="continue()" [disabled]="loading">Create an account</button>
        </div>
      </div>

      <div *ngIf="step==='signin'">
        <label>{{ email }}</label>
        <input type="password" placeholder="Password" [(ngModel)]="password" />
        <div class="actions">
          <button class="primary-btn" (click)="signIn()" [disabled]="loading">Sign in</button>
          <a class="cancel-link" (click)="step='email'">Back</a>
        </div>
      </div>

      <div *ngIf="step==='signup'">
        <label>{{ email }}</label>
        <input type="password" placeholder="Password" [(ngModel)]="password" />
        <input type="password" placeholder="Confirm password" [(ngModel)]="confirm" />
        <div class="actions">
          <button class="primary-btn" (click)="signUp()" [disabled]="loading">Create account</button>
          <a class="cancel-link" (click)="step='email'">Back</a>
        </div>
      </div>
    </ng-container>

    <p class="error" *ngIf="error">{{ error }}</p>
  </section>
</main>
