<main class="auth-shell">
  <section class="auth-card">
    <h1 *ngIf="step==='email'">Sign in with email</h1>
    <h1 *ngIf="step==='signin'">Enter your password</h1>
    <h1 *ngIf="step==='signup'">Create an account</h1>

    <div class="form-content" *ngIf="step==='email'">
      <div class="field-group">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com" [(ngModel)]="email" />
      </div>
      <div class="field-group">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" [(ngModel)]="password" />
      </div>
      <div class="actions">
        <button class="primary-btn" (click)="signIn()" [disabled]="loading">Sign in with email</button>
        <button class="google-btn" (click)="signInWithGoogle()" [disabled]="loading">Sign in with Google</button>
        <button class="text-btn" (click)="continue()" [disabled]="loading">Create an account</button>
        <a class="cancel-link" routerLink="/">Cancel</a>
      </div>
    </div>

    <div *ngIf="step==='signin'">
      <label>{{ email }}</label>
      <input type="password" placeholder="Password" [(ngModel)]="password" />
      <div class="actions">
        <button class="primary-btn" (click)="signIn()" [disabled]="loading">Sign in</button>
        <a class="cancel-link" (click)="step='email'">Back</a>
      </div>
    </div>

    <div *ngIf="step==='signup'">
      <label>{{ email }}</label>
      <input type="password" placeholder="Password" [(ngModel)]="password" />
      <input type="password" placeholder="Confirm password" [(ngModel)]="confirm" />
      <div class="actions">
        <button class="primary-btn" (click)="signUp()" [disabled]="loading">Create account</button>
        <a class="cancel-link" (click)="step='email'">Back</a>
      </div>
    </div>

    <p class="error" *ngIf="error">{{ error }}</p>
  </section>
</main>
