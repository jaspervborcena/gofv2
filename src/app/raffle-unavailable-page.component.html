<main class="unavailable-shell">
  <section class="unavailable-card" aria-labelledby="unavailable-title">
    <a class="brand-link" routerLink="/" aria-label="Go to Game of Fortunes home">
      <img src="assets/gofv2logo.png" alt="Game of Fortunes" />
    </a>
    <div class="status-mark" aria-hidden="true">!</div>
    <p class="eyebrow">Game of Fortunes</p>
    <h1 id="unavailable-title">{{ title }}</h1>

    <a class="primary-btn" routerLink="/">Back home</a>
  </section>
</main>
