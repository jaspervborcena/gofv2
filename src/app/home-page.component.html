<main class="app-shell">
  <section class="hero-card">
    <a class="home-brand" routerLink="/" aria-label="Game of Fortunes home">
      <img src="assets/gofv2logo.png" alt="Game of Fortunes" />
    </a>
    <div class="hero-copy">
      <h1>Your lucky number is waiting.</h1>
    </div>

    <div class="hero-panel">
      <div class="game-card">
        <h2>Roll for your lucky number</h2>
        <a class="card-preview slot-preview slot-preview-link" routerLink="/raffles" aria-label="Open raffles">
          <div class="slot-top">RAFFLES</div>
          <div class="mini-slot">
            <div class="reel">7</div><div class="reel">7</div><div class="reel">7</div>
          </div>
          <div class="slot-footer">Let's go</div>
        </a>
        <a class="launch-button" routerLink="/games/new">🎰 CREATE A RAFFLE</a>
      </div>
    </div>

    <div class="home-plans" aria-label="Plans">
      <article class="home-plan home-plan-download">
        <a class="home-download-button" routerLink="/download" aria-label="Download the Android app" title="Download the Android app">
          Download
        </a>
        <a class="home-download-icon-link" routerLink="/download" aria-label="Download the Android app" title="Download the Android app">
          <img class="home-download-icon" src="assets/download.png" alt="Android app" />
        </a>
      </article>
      <a class="home-plan home-plan-featured" routerLink="/plans">
        <strong>PLANS</strong>
        <span>Choose your plan</span>
      </a>
      <a class="home-plan" routerLink="/plans">
        <strong>PREMIUM</strong>
        <span>Coming soon</span>
      </a>
    </div>
  </section>
</main>
